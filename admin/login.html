<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پنل مدیریت | AMIN SYSTEM</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/jpeg" href="assets/company logo.jpg" />
    <link rel="stylesheet" href="css/admin-style.css?v=20" />
    <link rel="stylesheet" href="css/login.css?v=20" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

    <div class="login-card">

        <div class="login-logo-frame">
            <img src="assets/company logo with name.jpg" alt="Amin System" class="login-logo-img" />
        </div>
        <p class="login-subtitle">ورود به پنل مدیریت</p>

        <div class="login-error" id="loginError">
            یوزرنیم یا پسورد اشتباه است!
        </div>

        <form class="login-form" id="loginForm">

            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="loginUsername" placeholder="admin" autocomplete="username" required />
            </div>

            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                ورود
            </button>

        </form>

        <div class="login-hint">
            <strong>حساب‌های نمایشی این پروژه:</strong><br />
            مدیر کل (دسترسی کامل): <strong>admin / admin</strong><br />
            مسئول محصولات: <strong>products / products</strong><br />
            مسئول سفارش‌ها: <strong>orders / orders</strong>
        </div>

        <a href="http://localhost:3000/index.html" class="login-back">
            <i class="fas fa-arrow-right"></i>
            بازگشت به سایت
        </a>

    </div>

    <script src="data/admin-users.js?v=20"></script>
    <script src="js/auth.js?v=20"></script>
    <script>
        // اگر از قبل لاگین بود، مستقیم برو داشبورد
        (async function () {
            const existing = await AdminAuth.getSession();
            if (existing) {
                location.href = 'dashboard.html';
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const session = await AdminAuth.login(username, password);
            const errorBox = document.getElementById('loginError');

            if (session) {
                errorBox.classList.remove('show');
                location.href = 'dashboard.html';
            } else {
                errorBox.classList.add('show');
            }
        });
    </script>
</body>
</html>
